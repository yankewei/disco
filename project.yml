name: Disco
options:
  bundleIdPrefix: ai.disco
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Disco:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.disco.desktop
        PRODUCT_NAME: Disco
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - DiscoTests
  DiscoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Disco
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.disco.desktop.tests
        GENERATE_INFOPLIST_FILE: YES
