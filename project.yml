name: Disco
options:
  bundleIdPrefix: com.yankewei
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: 0.1.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Disco:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: Textual
        product: Textual
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yankewei.disco
        PRODUCT_NAME: Disco
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - DiscoTests
  DiscoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Disco
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yankewei.disco.tests
        GENERATE_INFOPLIST_FILE: YES
